spring:
  application:
    name: distributed-auth-orchestrator

  datasource:
    # Replace 'mro_db' with your actual database name
    url: jdbc:postgresql://localhost:5432/mro_db
    username: postgres
    # Replace with your actual Postgres password
    password: your_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 'update' automatically creates tables based on your Java entities
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092