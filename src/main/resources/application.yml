spring:
  application:
    name: distributed-auth-orchestrator

  datasource:
    # Uses DB_URL from .env or defaults to mro_db
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mro_db}
    # Uses DB_USERNAME from .env or defaults to postgres
    username: ${DB_USERNAME:postgres}
    # Uses DB_PASSWORD from .env
    password: ${DB_PASSWORD:your_fallback_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8081                          # App server port (default: 8081)

app:
  jwtSecret: ${JWT_SECRET:your_at_least_32_character_long_secret_key_here}
  jwtExpirationMs: ${JWT_EXPIRATION:86400000}


# Extra security config for your JWT logic later
jwt:
  secret: ${JWT_SECRET:a_long_random_default_secret_for_local_dev}


aws:
  access-key: ${AWS_ACCESS_KEY_ID}
  secret-key: ${AWS_SECRET_ACCESS_KEY}
  region: ${AWS_REGION:ap-south-1}
  s3:
    bucket-name: ${S3_BUCKET:mro-orchestrator-documents}